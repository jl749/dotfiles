# reload: <prefix>:source-file ~/.tmux.conf
#     or: tmux source ~/.tmux.conf

# force non-login shell
set -g default-command "${SHELL}"

# truecolor passthrough (nvim/vim termguicolors) and no <Esc> delay in nvim
set -as terminal-features ",*:RGB"
set -sg escape-time 10
set -g focus-events on

# change prefix key to ctrl-space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# copy mode: vim bindings
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# clipboard: OSC 52 works locally and over ssh; copy-command is the local fallback
set -s set-clipboard on
if-shell 'test -n "$WAYLAND_DISPLAY"' \
  'set -s copy-command "wl-copy"' \
  'set -s copy-command "xclip -in -selection clipboard"'

# plugins (<prefix>+I to install, <prefix>+U to update)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# bootstrap tpm on first run
if-shell 'test ! -d ~/.tmux/plugins/tpm' \
  'run "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'
run '~/.tmux/plugins/tpm/tpm'
